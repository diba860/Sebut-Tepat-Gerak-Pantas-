<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permainan Sebutan Bandar Kartun</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #70b5ff, #a1c4fd);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 10px;
        }

        .game-container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #ffcc00;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            border-bottom: 4px solid #ff9900;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stage-indicator, .score-indicator {
            background: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Canvas Scene */
        .scene-container {
            position: relative;
            width: 100%;
            height: 220px;
            background: linear-gradient(to bottom, #87CEEB 60%, #90EE90 60%);
            overflow: hidden;
            border-bottom: 4px solid #ddd;
        }

        .road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: #555;
            border-top: 6px dashed #fff;
        }

        .obstacle {
            position: absolute;
            bottom: 20px;
            right: 50px;
            font-size: 45px;
            transition: transform 0.5s ease;
            z-index: 5;
        }

        .car {
            position: absolute;
            bottom: 25px;
            left: 30px;
            font-size: 50px;
            transition: all 0.6s ease-in-out;
            z-index: 10;
            transform: scaleX(1); /* Menghadap ke kanan */
        }

        .car.jump {
            transform: translateY(-80px) scaleX(1);
        }

        .car.crash {
            transform: translateX(30px) rotate(15deg);
        }

        /* Panel Permainan */
        .play-area {
            padding: 20px;
            text-align: center;
            background: #f9f9f9;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .target-box {
            background: #fff;
            border: 3px dashed #4a90e2;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            width: 100%;
        }

        .place-icon {
            font-size: 30px;
            margin-bottom: 5px;
        }

        .target-sentence {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }

        .feedback {
            font-size: 15px;
            margin: 10px 0;
            min-height: 24px;
            font-weight: 600;
        }

        /* Butang Kawalan Mikrofon */
        .mic-btn {
            background: #e74c3c;
            color: white;
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 35px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(231, 76, 60, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
            margin: 10px auto;
        }

        .mic-btn:active {
            transform: scale(0.95);
        }

        .mic-btn.listening {
            background: #2ecc71;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.6); }
            70% { box-shadow: 0 0 0 20px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        .next-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            display: none;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
        }

        .next-btn:hover {
            background: #219653;
        }

        .fallback-box {
            margin-top: 15px;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #ddd;
            padding-top: 10px;
            width: 100%;
        }

        .bypass-btn {
            background: #8e44ad;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 5px;
        }

        .https-warning {
            background: #f39c12;
            color: white;
            padding: 8px;
            font-size: 12px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div id="httpsWarning" class="https-warning">
        ⚠️ Perhatian: Akses mikrofon memerlukan sambungan **HTTPS** atau **localhost** untuk berfungsi pada peranti mudah alih/Safari.
    </div>

    <div class="game-container">
        <div class="header">
            <div class="stage-indicator" id="stageIndicator">Tahap 1 / 10</div>
            <span>🚗 Permainan Sebutan</span>
            <div class="score-indicator" id="scoreIndicator">Markah: 0</div>
        </div>

        <div class="scene-container">
            <div class="road"></div>
            <div class="car" id="car">🚗</div>
            <div class="obstacle" id="obstacle">🚧</div>
        </div>

        <div class="play-area">
            <div class="target-box">
                <div class="place-icon" id="placeIcon">🏫</div>
                <div class="target-sentence" id="targetSentence">SJKT Perak River Valley itu cantik.</div>
            </div>

            <div class="feedback" id="feedback">Tekan butang mikrofon & sebut ayat di atas!</div>

            <button class="mic-btn" id="micBtn" title="Tekan untuk bercakap">🎙️</button>
            <button class="next-btn" id="nextBtn" onclick="nextStage()">Tahap Seterusnya ➡️</button>

            <!-- Mod Pintasan / Fallback sekiranya mic bermasalah pada Safari -->
            <div class="fallback-box">
                <span>Ada masalah mikrofon pada iPhone/Safari?</span><br>
                <button class="bypass-btn" onclick="bypassSpeech()">Guna Mod Simulasi (Langkau Sebutan)</button>
            </div>
        </div>
    </div>

    <script>
        // Semakan protokol HTTPS
        if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            document.getElementById('httpsWarning').style.display = 'block';
        }

        const sentences = [
            { text: "SJKT Perak River Valley itu cantik.", icon: "🏫" },
            { text: "Taman ini besar dan hijau.", icon: "🌳" },
            { text: "Perpustakaan itu sunyi dan bersih.", icon: "📚" },
            { text: "Pasar itu sibuk dan bising.", icon: "🛒" },
            { text: "Pusat membeli-belah itu besar dan terang.", icon: "🏢" },
            { text: "Muzium itu lama tetapi menarik.", icon: "🏛️" },
            { text: "Hospital itu besar dan moden.", icon: "🏥" },
            { text: "Taman permainan itu berwarna-warni.", icon: "🎡" },
            { text: "Stesen kereta api itu sibuk.", icon: "🚂" },
            { text: "Bandar ini cantik dan bersih.", icon: "🏙️" }
        ];

        let currentLevel = 0;
        let score = 0;
        let isAnswered = false;

        const stageIndicator = document.getElementById('stageIndicator');
        const scoreIndicator = document.getElementById('scoreIndicator');
        const targetSentence = document.getElementById('targetSentence');
        const placeIcon = document.getElementById('placeIcon');
        const feedback = document.getElementById('feedback');
        const micBtn = document.getElementById('micBtn');
        const nextBtn = document.getElementById('nextBtn');
        const car = document.getElementById('car');
        const obstacle = document.getElementById('obstacle');

        // Web Audio API untuk Kesan Bunyi
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Paparkan Tahap Semasa
        function loadStage() {
            isAnswered = false;
            targetSentence.textContent = sentences[currentLevel].text;
            placeIcon.textContent = sentences[currentLevel].icon;
            stageIndicator.textContent = `Tahap ${currentLevel + 1} / ${sentences.length}`;
            scoreIndicator.textContent = `Markah: ${score}`;
            feedback.textContent = "Tekan butang mikrofon & sebut ayat di atas!";
            feedback.style.color = "#333";
            nextBtn.style.display = "none";
            car.className = "car";
            micBtn.disabled = false;
            micBtn.style.opacity = "1";
        }

        // Algoritma Persamaan (Levenshtein Distance untuk Toleransi ~70-90%)
        function calculateSimilarity(s1, s2) {
            let longer = s1.toLowerCase();
            let shorter = s2.toLowerCase();
            if (longer.length < shorter.length) {
                longer = s2;
                shorter = s1;
            }
            const longLength = longer.length;
            if (longLength === 0) return 1.0;
            return (longLength - editDistance(longer, shorter)) / parseFloat(longLength);
        }

        function editDistance(s1, s2) {
            s1 = s1.toLowerCase();
            s2 = s2.toLowerCase();
            let costs = new Array();
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i === 0) costs[j] = j;
                    else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) !== s2.charAt(j - 1))
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        // Sistem Pengecaman Suara Push-To-Talk
        micBtn.addEventListener("click", async () => {
            if (isAnswered) return;

            // 1. Minta kebenaran akses mikrofon secara eksplisit (Penting untuk Safari/iOS)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                // Tutup semula strim selepas dapat izin supaya recognition boleh guna
                stream.getTracks().forEach(track => track.stop());
            } catch (err) {
                console.error("Ralat akses mikrofon:", err);
                feedback.textContent = "Sila benarkan akses mikrofon untuk bermain.";
                feedback.style.color = "#e74c3c";
                alert("Sila pastikan anda memberi kebenaran mikrofon pada tetapan pelayar (Safari/Chrome).");
                return;
            }

            // 2. Mulakan Speech Recognition
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Pelayar ini tidak menyokong pengecaman suara. Sila gunakan Google Chrome atau Safari terkini.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = "ms-MY";
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                micBtn.classList.add("listening");
                feedback.textContent = "Mendengar... Sila sebut dengan jelas.";
                feedback.style.color = "#2980b9";
            };

            recognition.onresult = (event) => {
                const speechResult = event.results[0][0].transcript;
                const targetText = sentences[currentLevel].text;
                
                // Semak persamaan sebutan
                const similarity = calculateSimilarity(speechResult, targetText);
                console.log(`Dengar: "${speechResult}" | Sasaran: "${targetText}" | Skor: ${similarity}`);

                // Toleransi sebutan sekitar 70% ke atas
                if (similarity >= 0.70 || speechResult.toLowerCase().includes(targetText.toLowerCase().substring(0, 10))) {
                    // Betul
                    isAnswered = true;
                    score += 10;
                    scoreIndicator.textContent = `Markah: ${score}`;
                    feedback.textContent = `Hebat! Anda sebut: "${speechResult}"`;
                    feedback.style.color = "#27ae60";
                    car.classList.add("jump");
                    playSound('success');
                    nextBtn.style.display = "block";
                    micBtn.disabled = true;
                    micBtn.style.opacity = "0.6";
                } else {
                    // Salah / Kurang tepat
                    feedback.textContent = `Dengar: "${speechResult}". Cuba lagi!`;
                    feedback.style.color = "#e74c3c";
                    car.classList.add("crash");
                    playSound('crash');
                    setTimeout(() => car.classList.remove("crash"), 600);
                }
            };

            recognition.onerror = (event) => {
                console.error("Ralat Recognition:", event.error);
                if (event.error === 'no-speech') {
                    feedback.textContent = "Tiada suara dikesan. Sila cuba lagi.";
                } else {
                    feedback.textContent = "Ralat mikrofon. Sila cuba butang mod alternatif di bawah.";
                }
                feedback.style.color = "#e74c3c";
                micBtn.classList.remove("listening");
            };

            recognition.onend = () => {
                micBtn.classList.remove("listening");
            };

            try {
                recognition.start();
            } catch (e) {
                console.error("Gagal start recognition:", e);
            }
        });

        // Butang Alternatif untuk Langkau/Simulasi jika mikrofon terhalang di iOS Safari
        function bypassSpeech() {
            if (isAnswered) return;
            isAnswered = true;
            score += 10;
            scoreIndicator.textContent = `Markah: ${score}`;
            feedback.textContent = "Mod Simulasi Berjaya Dilangkau!";
            feedback.style.color = "#8e44ad";
            car.classList.add("jump");
            playSound('success');
            nextBtn.style.display = "block";
            micBtn.disabled = true;
            micBtn.style.opacity = "0.6";
        }

        // Pergi ke tahap seterusnya
        function nextStage() {
            currentLevel++;
            if (currentLevel < sentences.length) {
                loadStage();
            } else {
                feedback.textContent = `Tahniah! Permainan Tamat. Jumlah Markah: ${score}`;
                feedback.style.color = "#27ae60";
                targetSentence.textContent = "🏆 Anda telah melengkapkan semua tahap!";
                placeIcon.textContent = "🎉";
                nextBtn.style.display = "none";
                micBtn.style.display = "none";
            }
        }

        // Muat tahap pertama
        loadStage();
    </script>
</body>
</html>
